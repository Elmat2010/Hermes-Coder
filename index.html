<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contador de palabras</title>
  </head>
  <body>
    <main>
      <h1>Contador de palabras</h1>
      <label for="texto">Escribe o pega tu texto</label>
      <textarea id="texto" rows="10" placeholder="Empieza a escribir…"></textarea>
      <p id="resultado" aria-live="polite">0 palabras · 0 caracteres · 0 min de lectura</p>
      <button id="limpiar" type="button">Limpiar</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
